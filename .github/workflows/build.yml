name: Build Go Bot

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bot-app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-app
          path: bot-app
